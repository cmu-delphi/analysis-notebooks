            href: examples/nickel/eval_diarrhea_ed.html
          - text: "Diarrhea: Inpatient Visits"
            href: examples/nickel/eval_diarrhea_ip.html
          - text: "Diarrhea: Outpatient Visits"
            href: examples/nickel/eval_diarrhea_op.html
          - text: "State: Sleep Cycle Cough Signals"
            href: examples/sleepcycle/sleepcycle_all_state.html
          - text: "County: Sleep Cycle Cough Signals"
            href: examples/sleepcycle/sleepcycle_all_county.html
          - text: "State: VA COVID Cases/100k"
            href: examples/va/state_ci.html
          - text: "MSA: VA COVID Cases/100k"
            href: examples/va/msa_ci.html
      - text: Revisions
        menu:
          - text: "State: COVID-19 Hospital Admissions"
            href: revision_analysis/revision_hospital_admissions_smoothed_covid19_from_claims_api_state.html
      - text: ETL Comparison
        menu:
          - text: "HRR: Old vs New Pipeline Claims (DV)"
