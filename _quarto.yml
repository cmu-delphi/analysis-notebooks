project:
  type: website
  lib-dir: site_libs
  pre-render: scripts/pre_render.R
  post-render: scripts/post_render.R
  render:
    - index.qmd
    - vignettes/eval_hhs_vs_doctor_visits_api_state.qmd
    - vignettes/eval_confirmed_incidence_num_vs_doctor_visits_api_county.qmd
  resources:
    - "indicator_analysis/comp_hhs_vs_doctor_visits_api_state.html"
