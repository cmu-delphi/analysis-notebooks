    - "examples/nickel/eval_diarrhea_ed.html"
    - "examples/nickel/eval_diarrhea_ip.html"
    - "examples/nickel/eval_diarrhea_op.html"
    - "examples/sleepcycle/sleepcycle_all_state.html"
    - "examples/sleepcycle/sleepcycle_all_county.html"
    - "examples/va/state_ci.html"
    - "examples/va/msa_ci.html"
    - "revision_analysis/revision_hospital_admissions_smoothed_covid19_from_claims_api_state.html"
